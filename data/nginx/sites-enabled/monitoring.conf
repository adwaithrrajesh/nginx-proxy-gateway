server {
    listen 8080; # Dedicated port for internal monitoring
    server_name localhost;

    access_log off;
    allow 127.0.0.1;
    allow 172.16.0.0/12; # Allow Docker internal network
    deny all;

    location /nginx_status {
        stub_status on;
    }

    # Healthcheck endpoint that returns 200
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
